name: Publish isolated cover visual preview
on:
  push:
    branches: [feature/home-portraits-live2d]
    paths:
      - '.github/workflows/deploy-cover-preview.yml'
      - 'docs/cover-preview-publish.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  compose:
    if: github.ref == 'refs/heads/feature/home-portraits-live2d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refuse changed baseline or obsolete feature input
        run: node scripts/check-cover-pages-inputs.mjs
      - run: npm ci
      - name: Build only the approved cover visual preview
        run: npm run check && npm run build:cover-preview
      - name: Test preservation contract
        run: node --test tests/cover-pages.test.mjs
      - name: Retrieve the pinned successful Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/38639517124 > baseline-run.json
          node -e "const r=require('./baseline-run.json'); if(r.conclusion!=='success'||r.head_sha!=='4357252f2a356b46426419325e4fb3ff70b2f053'||r.head_branch!=='dev')process.exit(1)"
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11930010985/zip > baseline.zip
          echo '628c05d2cc6a11b6da63390ebfbb138c7ef84e45c48341743792f3d7e8da6f0f  baseline.zip' | sha256sum -c -
          unzip -p baseline.zip artifact.tar > baseline.tar
          mkdir baseline
          python3 - <<'PY'
          import tarfile,pathlib
          with tarfile.open('baseline.tar') as archive:
              for member in archive.getmembers():
                  path=pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts, member.name
                  assert member.isdir() or member.isfile(), member.name
              archive.extractall('baseline',filter='data')
          PY
      - name: Add preview and prove every baseline file unchanged
        run: node scripts/compose-cover-pages.mjs baseline dist-cover-preview dist-pages
      - uses: actions/upload-artifact@v4
        with:
          name: cover-preservation-report
          path: cover-preservation-report.json
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}cover-preview/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck exact baseline and feature identity immediately before publishing
        run: node scripts/check-cover-pages-inputs.mjs
      - id: deployment
        uses: actions/deploy-pages@v4
