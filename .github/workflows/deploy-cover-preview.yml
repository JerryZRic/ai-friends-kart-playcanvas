name: Publish isolated cover visual preview
on:
  push:
    branches: [feature/home-portraits-live2d]
    paths:
      - '.github/workflows/deploy-cover-preview.yml'
      - 'docs/cover-preview-publish.json'
      - 'docs/pages-snapshot.json'
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  compose:
    if: github.ref == 'refs/heads/feature/home-portraits-live2d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refuse changed baseline or obsolete feature input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-pages-snapshot.mjs
      - run: npm ci
      - name: Build only the approved cover visual preview
        run: npm run check && npm run build:cover-preview
      - name: Test preservation contract
        run: node --test tests/pages-snapshot.test.mjs
      - name: Download the pinned successful complete Pages snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/download-pages-snapshot.py
      - name: Replace only cover and verify stable root and dev bytes unchanged
        run: node scripts/compose-pages-snapshot.mjs baseline-pages dist-cover-preview dist-pages cover-preview
      - uses: actions/upload-artifact@v4
        with:
          name: pages-preservation-report
          path: pages-preservation-report.json
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
          retention-days: 30
  deploy:
    needs: compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
      deployments: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}cover-preview/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck exact baseline and feature identity immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-pages-snapshot.mjs
      - id: deployment
        uses: actions/deploy-pages@v4
