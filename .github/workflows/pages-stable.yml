name: Build and publish main PlayCanvas game
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      quality:
        description: Stable certification only when explicitly requested; otherwise nonstable targeted regression
        required: true
        type: choice
        options: [nonstable, stable]
        default: nonstable
      base_sha:
        description: Optional exact comparison commit for nonstable targeted regression
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Certify an explicitly requested stable build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.quality == 'stable' }}
        run: npm run check && npm test && npm run build
      - name: Build main with changed-module regression by default
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.quality != 'stable' }}
        env:
          TARGETED_BASE_SHA: ${{ inputs.base_sha }}
        run: npm run check && node scripts/test-targeted.mjs && npm run build
      - run: npm run test:dist
      - name: Publish the approved build at stable and preview URLs
        run: |
          mkdir dist-pages
          cp -a dist/. dist-pages/
          mkdir dist-pages/dev
          cp -a dist/. dist-pages/dev/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Refuse an obsolete stable deployment
        run: |
          actual=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$actual" = "$GITHUB_SHA"
      - id: deployment
        uses: actions/deploy-pages@v4
