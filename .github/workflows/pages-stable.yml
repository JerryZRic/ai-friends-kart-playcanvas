name: Build and publish stable PlayCanvas game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: npm run test:dist
      - name: Publish the approved build at stable and preview URLs
        run: |
          mkdir dist-pages
          cp -a dist/. dist-pages/
          mkdir dist-pages/dev
          cp -a dist/. dist-pages/dev/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Refuse an obsolete stable deployment
        run: |
          actual=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$actual" = "$GITHUB_SHA"
      - id: deployment
        uses: actions/deploy-pages@v4
