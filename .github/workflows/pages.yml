name: Build and publish PlayCanvas game
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the isolated dev preview while preserving the stable root
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  deployments: read
# Match main's manual workflow so stable and preview deployments cannot overlap.
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.build-artifact.outputs.artifact-id }}
      provenance-sha256: ${{ steps.provenance.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test commit-derived version identity
        run: node --import tsx --test tests/build-identity.test.ts tests/build-version.test.ts
      - name: Test independent home graphics ownership and lifecycle
        run: node --import tsx --test tests/application-ownership.test.ts tests/home-cover.test.ts tests/menu-backdrop.test.ts
      - run: npm run build
        env:
          DEV_BUILD_SHA: ${{ github.sha }}
      - name: Seal the compiled build and its exact run identity
        id: provenance
        run: node scripts/verified-build-artifact.mjs seal
      # Persist before any stable-site network access. Failed compose/deploy jobs
      # can be retried without rebuilding the successfully compiled preview.
      - uses: actions/upload-artifact@v4
        id: build-artifact
        with:
          name: verified-dev-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-build
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  compose:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download only this run's successful build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: verified-build
          merge-multiple: true
      - name: Verify every build byte and originating run before composition
        env:
          EXPECTED_PROVENANCE_SHA256: ${{ needs.build.outputs.provenance-sha256 }}
        run: node scripts/verified-build-artifact.mjs verify
      - name: Test isolated replacement and stale-publication guards
        run: node --test tests/pages-snapshot.test.mjs tests/pages-dev-source.test.mjs
      - name: Check exact refs and latest successful Pages identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-pages-snapshot.mjs
      - name: Download the pinned successful complete Pages snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/download-pages-snapshot.py
      - name: Link exact dev corresponding source without duplicating the archive in Pages
        run: node scripts/prepare-pages-dev.mjs verified-build/dist dist-dev
      - name: Replace only dev and verify stable root and cover bytes unchanged
        run: node scripts/compose-pages-snapshot.mjs baseline-pages dist-dev dist-pages dev
      - uses: actions/upload-artifact@v4
        with:
          name: pages-preservation-report
          path: |
            pages-preservation-report.json
            dev-source-migration-report.json
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
          retention-days: 30
  deploy:
    needs: [build, compose]
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
      deployments: read
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dev/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse stale source refs or an obsolete published snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-pages-snapshot.mjs
      - id: deployment
        uses: actions/deploy-pages@v4

