<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#285e61"><meta name="description" content="大肥鱼卡丁车 DEV 改装车库：54 个食物主题、324 个全部开放的原创零件，五种可编辑推荐、六槽自由混搭，真实 3D 预览与海岸试跑。"><title>好味改装工坊 · 大肥鱼卡丁车</title><link rel="stylesheet" href="/src/ui-layout.css"><link rel="stylesheet" href="/src/kart-garage-fixed.css"><link rel="stylesheet" href="/src/kart-garage-stats.css"><link rel="stylesheet" href="/src/character-emblems.css"></head>
<body><a id="source-license" class="garage-source-fallback" href="./source.html">开源代码与模型许可 ↗</a><main id="kart-garage"><section class="garage-boot"><span class="eyebrow">AI FRIENDS KART / GARAGE</span><h1>改装车库</h1><p id="garage-boot-status" role="status">正在载入车库程序…</p><a href="./index.html?screen=characters&map=coast">← 返回角色选择</a><button id="garage-boot-retry" hidden onclick="location.reload()">重新载入</button></section></main><noscript><p>请开启 JavaScript 后使用改装车库</p></noscript>
<script>
// Fit recovery controls before the module graph (including PlayCanvas) loads.
(function(){var root=document.getElementById('kart-garage'),v=window.visualViewport;
function fit(){var p=window.visualViewport,w=p&&p.width||innerWidth||1440,h=p&&p.height||innerHeight||900,k=Math.min(w/1440,h/900);root.setAttribute('data-fixed-layout','1440x900');root.style.setProperty('--garage-ui-scale',String(k));root.style.setProperty('--garage-ui-left',((p&&p.offsetLeft||0)+(w-1440*k)/2)+'px');root.style.setProperty('--garage-ui-top',((p&&p.offsetTop||0)+(h-900*k)/2)+'px');}
function release(){removeEventListener('resize',fit);removeEventListener('orientationchange',fit);if(v){v.removeEventListener('resize',fit);v.removeEventListener('scroll',fit);}}
window.__garageBootLayout={release:release};addEventListener('resize',fit);addEventListener('orientationchange',fit);if(v){v.addEventListener('resize',fit);v.addEventListener('scroll',fit);}fit();})();
setTimeout(function(){var s=document.getElementById('garage-boot-status');if(s){s.textContent='车库程序加载时间较长，请检查网络或重新载入';document.getElementById('garage-boot-retry').hidden=false;}},30000);window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'){var s=document.getElementById('garage-boot-status');if(s)s.textContent='车库程序加载失败，请检查网络后重试';var b=document.getElementById('garage-boot-retry');if(b)b.hidden=false;}},true);window.addEventListener('unhandledrejection',function(){var s=document.getElementById('garage-boot-status');if(s)s.textContent='车库未能完成初始化，请重新载入';var b=document.getElementById('garage-boot-retry');if(b)b.hidden=false;});</script><script type="module" src="/src/kart-garage.ts"></script></body></html>
