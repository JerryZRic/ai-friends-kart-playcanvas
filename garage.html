<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#efece3"><meta name="description" content="大肥鱼卡丁车 DEV 改装车库：54 个食物主题、324 个原创零件，六槽自由混搭，真实 3D 预览与海岸试跑。"><title>改装车库 · 大肥鱼卡丁车</title><link rel="stylesheet" href="/src/kart-garage.css"></head>
<body><main id="kart-garage"><section class="garage-boot"><span class="eyebrow">AI FRIENDS KART / GARAGE</span><h1>改装车库</h1><p id="garage-boot-status" role="status">正在载入车库程序…</p><a href="./index.html?screen=characters&map=coast">← 返回角色选择</a><button id="garage-boot-retry" hidden onclick="location.reload()">重新载入</button></section></main><noscript><p>请开启 JavaScript 后使用改装车库</p></noscript>
<script>setTimeout(function(){var s=document.getElementById('garage-boot-status');if(s){s.textContent='车库程序加载时间较长，请检查网络或重新载入';document.getElementById('garage-boot-retry').hidden=false;}},30000);window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'){var s=document.getElementById('garage-boot-status');if(s)s.textContent='车库程序加载失败，请检查网络后重试';var b=document.getElementById('garage-boot-retry');if(b)b.hidden=false;}},true);window.addEventListener('unhandledrejection',function(){var s=document.getElementById('garage-boot-status');if(s)s.textContent='车库未能完成初始化，请重新载入';var b=document.getElementById('garage-boot-retry');if(b)b.hidden=false;});</script><script type="module" src="/src/kart-garage.ts"></script></body></html>
