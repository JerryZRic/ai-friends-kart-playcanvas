<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0e242b"><meta name="description" content="AI Friends Kart 自由模式：六位伙伴，两种载具，海岸与水上乐园竞速。"><title>大肥鱼卡丁车</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230e242b'/%3E%3Cpath d='M23 5 10 23h10l-3 12 14-20H21z' fill='%23d4ff57'/%3E%3C/svg%3E"><link rel="stylesheet" href="/src/menu.css"><style>
/* The boot shell is present before the heavy module graph executes. */
html,body{margin:0;min-height:100%;background:#173944;color:#fff5dd;font-family:system-ui,sans-serif}
[hidden]{display:none!important}.boot-cover{min-height:100svh;box-sizing:border-box;text-align:center;padding:8svh 6vw;background:linear-gradient(155deg,#78999d,#385f68 50%,#152c38)}.boot-cover h1{margin:0;font-size:clamp(34px,8vw,100px)}
#menu-boot{position:fixed;z-index:20;left:50%;bottom:max(7svh,28px);transform:translateX(-50%);box-sizing:border-box;width:min(540px,86vw);padding:20px 24px;border:1px solid #fff4d86b;border-radius:16px;background:#123641ed;box-shadow:0 12px 40px #001a244d;text-align:center}
#menu-boot p{margin:0 0 12px;line-height:1.5}#menu-boot progress{display:block;width:100%;height:12px;accent-color:#f4df9d}#menu-boot small{display:block;margin-top:10px;color:#d6e4df;line-height:1.5}#menu-boot button{font:inherit;color:#173944;background:#fff0c9;border:0;border-radius:8px;padding:10px 16px;margin:12px 4px 0;cursor:pointer}#menu-boot button:focus-visible{outline:3px solid white;outline-offset:3px}
body[data-menu-loading="true"] .title-actions{display:none!important}
</style></head>
<body data-screen="main" data-menu-loading="true"><div class="ambient" aria-hidden="true"></div><header class="masthead"><a class="wordmark" href="./index.html" aria-label="AI Friends Kart 主菜单">AI FRIENDS<span>KART<span class="brand-dot">.</span></span></a><a class="garage-header-link" href="./garage.html?driver=whale">改装车库 ↗</a><div class="build-label"><span class="live-dot"></span> 自由模式 · DEV 试玩</div></header><main id="menu" class="screen-main" tabindex="-1"><section class="boot-cover"><h1>大肥鱼卡丁车</h1></section></main>
<section id="menu-boot" aria-label="首页加载" aria-busy="true"><p id="menu-boot-status" role="status" aria-live="polite">正在载入菜单程序…</p><progress id="menu-boot-progress" max="4" value="0" aria-label="首页准备阶段"></progress><small id="menu-boot-detail">准备阶段 1 / 4 · 首次打开可能需要稍候</small><div><button id="menu-boot-retry" hidden>重新加载</button><button id="menu-boot-continue" hidden>使用静态背景继续</button></div></section>
<script>
/* Deliberately inline and independent of the engine: even a failed module fetch
   must leave an understandable recovery path, never four dead buttons. */
(function(){
 var panel=document.getElementById('menu-boot'),status=document.getElementById('menu-boot-status'),bar=document.getElementById('menu-boot-progress'),detail=document.getElementById('menu-boot-detail'),retry=document.getElementById('menu-boot-retry'),proceed=document.getElementById('menu-boot-continue');
 var timer,failed=false,finished=false,fallback;
 function fail(message){if(finished||failed)return;failed=true;clearTimeout(timer);panel.setAttribute('aria-busy','false');status.textContent=message;detail.textContent='请检查网络后重试；若当前设备无法显示 3D，可使用静态背景进入菜单';bar.hidden=true;retry.hidden=false;proceed.hidden=!fallback;}
 function begin(next){clearTimeout(timer);fallback=next;failed=false;finished=false;panel.hidden=false;panel.setAttribute('aria-busy','true');bar.hidden=false;bar.value=0;retry.hidden=true;proceed.hidden=true;document.body.dataset.menuLoading='true';status.textContent='正在载入菜单程序…';detail.textContent='准备阶段 1 / 4 · 首次打开可能需要稍候';timer=setTimeout(function(){fail('加载时间较长，暂时无法完成首页准备');},30000);}
 function ready(){if(failed)return false;finished=true;clearTimeout(timer);bar.value=4;panel.hidden=true;panel.setAttribute('aria-busy','false');document.body.dataset.menuLoading='false';return true;}
 retry.addEventListener('click',function(){retry.disabled=true;location.reload();});
 proceed.addEventListener('click',function(){if(!fallback||finished)return;var action=fallback;fallback=undefined;failed=false;ready();action();});
 window.__menuBoot={begin:begin,stage:function(step,text){if(failed||finished)return;bar.value=step-1;status.textContent=text;detail.textContent='准备阶段 '+step+' / 4 · 按实际初始化步骤推进';},ready:ready,dismiss:function(){failed=false;fallback=undefined;ready();},fail:fail};
 window.addEventListener('error',function(event){if(event.target&&event.target.tagName==='SCRIPT')fail('菜单程序加载失败，请重新加载');},true);
 window.addEventListener('unhandledrejection',function(){fail('首页初始化未完成，请重新加载');});
 begin();
})();
</script><footer class="site-footer"><span>六位伙伴 · 两种竞速体验</span><a href="./source.html">开源代码与模型许可 ↗</a><span>仅供非商业试玩</span></footer><noscript><style>#menu-boot{display:none}.no-script{position:fixed;left:0;right:0;bottom:10vh;background:#173944}</style><p class="no-script">请开启 JavaScript 以选择地图和角色</p></noscript><script type="module" src="/src/menu.ts"></script></body></html>
