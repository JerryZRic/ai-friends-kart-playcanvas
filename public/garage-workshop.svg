<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" fill="none">
<title>The little kart workshop</title>
<desc>An original nostalgic toy workshop with turquoise plaster, amber window light, timber rafters, brass lamps, tools and well-loved shelves. The centre is left clear.</desc>
