    <div class="panel race-finish-panel">
      <span class="eyebrow">RACE RESULTS</span>
      <h1 id="title">比赛结果</h1>
      <div class="chinese" id="subtitle"></div>
      <p id="desc"></p>
      <div class="results hidden" id="results"></div>

<button id="restart" type="button" disabled>重新开始比赛</button><a id="change-driver" href="index.html?screen=characters&amp;map=waterpark">更换角色</a><a id="change-map" href="index.html?screen=maps&amp;map=waterpark">更换地图</a>

<aside id="startup-recovery" data-cold-recovery hidden style="position:fixed;inset:0;z-index:2147483646;display:none;place-content:center;gap:16px;background:#fff;color:#232334;text-align:center;font:18px system-ui"><p>游戏程序暂时未能载入，请检查网络后重试</p><button onclick="location.reload()" style="font:inherit;padding:12px">重新加载</button></aside><script>
(function(){var panel=document.getElementById('startup-recovery'),timer;
function fail(){if(!panel.isConnected)return;panel.hidden=false;panel.style.display='grid';var intro=document.getElementById('brand-intro');if(intro)intro.remove();}
function error(event){if(event.target&&event.target.tagName==='SCRIPT')fail();}
function release(){clearTimeout(timer);removeEventListener('error',error,true);removeEventListener('unhandledrejection',fail);delete window.__releaseColdRecovery;}
window.__releaseColdRecovery=release;addEventListener('error',error,true);addEventListener('unhandledrejection',fail);timer=setTimeout(fail,15000);
})();
</script><script type="module" src="/src/spa.ts"></script></body>
