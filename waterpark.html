<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#172936">
  <meta name="description" content="AI Friends Kart：晴空水上乐园，六位伙伴同场三圈竞速。">
  <title>晴空水上乐园 · AI Friends Kart · 非商业试玩</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23172936'/%3E%3Cpath d='M23 5 10 23h10l-3 12 14-20H21z' fill='%23d4ff57'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/race-ui.css">
</head>
<body class="menu waterpark-race">
  <div id="raceUi" class="fixed-ui-root">
  <div id="raceHud"></div>
  <div id="raceLoading"></div>
  <section class="overlay race-finish" id="overlay" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="subtitle">
    <div class="panel race-finish-panel">
      <span class="eyebrow">RACE RESULTS</span>
      <h1 id="title">比赛结果</h1>
      <div class="chinese" id="subtitle"></div>
      <p id="desc"></p>
      <div class="results hidden" id="results"></div>
      <nav class="race-nav race-finish-actions" aria-label="赛后操作">
        <button class="start" id="start" disabled><span id="startText">再来一场</span><span aria-hidden="true">↗</span></button>
        <a id="raceChangeMap" href="index.html?screen=maps&amp;map=waterpark">更换地图</a>
        <a id="raceMainMenu" href="index.html">返回主菜单</a>
      </nav>
    </div>
  </section>
  <div class="legacy-race-menu" hidden inert aria-hidden="true">
      <section class="loading-panel race-loading" aria-label="角色加载进度">
        <div class="loading" id="load" role="status" aria-live="polite">正在准备六位角色…</div>
        <button id="retry" class="retry-loading hidden" type="button">重试失败角色</button>
      </section>
      <section class="driver-picker" aria-label="角色选择">
        <div class="driver-heading">选择你的角色 / Select driver</div>
        <div class="driver-grid" id="drivers" aria-label="选择角色"></div>
        <div class="import-help">六位原有角色自动加载；模型仅作非商业试玩。</div>
      </section>
      <div id="message" role="status" aria-live="polite"></div>

<button id="restart" type="button" disabled>重新开始比赛</button><a id="change-driver" href="index.html?screen=characters&amp;map=waterpark">更换角色</a><a id="change-map" href="index.html?screen=maps&amp;map=waterpark">更换地图</a>
    <div id="instructions"></div>
  </div>
  </div>
  <script type="module" src="/src/waterpark-play.ts"></script>
</body>
</html>
